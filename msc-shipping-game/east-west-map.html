<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MSC East-West Service Network Map</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --navy:#003087; --blue:#009ADE; --dark:#001a4d; --bg:#060f1e;
  --gold:#f0a500; --green:#00a86b; --red:#e05050;
}
html, body {
  width:100%; height:100%; overflow:hidden;
  background:var(--bg); font-family:'Segoe UI',Arial,sans-serif; color:#fff;
  display:flex; flex-direction:column;
}

/* ── HEADER ── */
.hdr {
  background:var(--navy); border-bottom:3px solid var(--blue);
  padding:10px 16px; display:flex; align-items:center; gap:12px;
  flex-shrink:0; height:52px;
}
.hdr-logo {
  font-size:22px; font-weight:900; letter-spacing:3px;
  background:var(--blue); padding:3px 10px; border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  min-width:64px; height:34px;
}
.hdr-title { font-size:15px; font-weight:600; color:rgba(255,255,255,0.85); flex:1; }
.hdr-back {
  margin-left:auto; background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.3); color:#fff;
  padding:5px 12px; border-radius:6px; cursor:pointer; font-size:13px;
  text-decoration:none; display:inline-flex; align-items:center; gap:6px;
  transition:background 0.2s;
}
.hdr-back:hover { background:rgba(255,255,255,0.25); }

/* ── MAP CONTAINER ── */
.map-wrap {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start;
  overflow:auto; padding:0; position:relative;
  background:#06101e;
}
.map-img {
  width:100%;
  max-width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* ── LABEL BAR ── */
.label-bar {
  flex-shrink:0; background:rgba(0,48,135,0.85);
  border-top:2px solid var(--blue);
  padding:7px 16px;
  display:flex; align-items:center; justify-content:center; gap:18px;
  flex-wrap:wrap;
}
.lbl-item {
  display:flex; align-items:center; gap:6px;
  font-size:11px; color:rgba(255,255,255,0.75);
}
.lbl-dot {
  width:10px; height:10px; border-radius:50%; flex-shrink:0;
}

/* ── CREATOR CARD ── */
.maker-card {
  position:fixed;
  top:62px;
  left:14px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.16);
  border-radius:10px;
  padding:6px 8px;
  width:188px;
  max-width:36vw;
  z-index:10;
}
.maker-title {
  font-size:9px; text-transform:uppercase;
  letter-spacing:1px; color:rgba(255,255,255,0.58); margin-bottom:4px;
}
.maker-line { font-size:10px; color:rgba(255,255,255,0.9); margin-bottom:2px; }
.maker-line strong { color:#fff; }
.maker-note {
  margin-top:5px; font-size:9px;
  color:rgba(255,255,255,0.72); line-height:1.3;
}

/* ── ZOOM CONTROLS ── */
.zoom-bar {
  position:fixed; bottom:16px; right:16px;
  display:flex; flex-direction:column; gap:6px; z-index:10;
}
.zbtn {
  width:38px; height:38px; border-radius:8px;
  background:rgba(0,48,135,0.85); border:1px solid rgba(255,255,255,0.25);
  color:#fff; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.2s; user-select:none;
}
.zbtn:hover { background:rgba(0,154,222,0.6); }

/* ── Toast ── */
#toast {
  position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
  background:rgba(6,10,24,0.92); color:#fff; padding:10px 20px;
  border-radius:8px; font-size:12px; z-index:99999;
  border:1px solid rgba(255,255,255,0.15); pointer-events:none;
  opacity:0; transition:opacity 0.3s; max-width:90vw; text-align:center;
}

/* ── Responsive ── */
@media(max-width:580px){
  .hdr-title { font-size:13px; }
  .maker-card { max-width:52vw; }
  .label-bar { gap:10px; padding:6px 10px; }
  .lbl-item { font-size:10px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-logo">MSC</div>
  <div class="hdr-title">🗺️ East-West Service Network</div>
  <a class="hdr-back" href="index.html">← Back</a>
</div>

<!-- CREATOR CARD -->
<div class="maker-card">
  <div class="maker-title">Creator</div>
  <div class="maker-line"><strong>Name:</strong> Rudwan Barouni</div>
  <div class="maker-line"><strong>Email:</strong> Rudwan.barouni@gmail.com</div>
  <div class="maker-line"><strong>Phone:</strong> +387-61657883</div>
  <div class="maker-note">Designed and developed by Rudwan Barouni. Copyright © 2026. All rights reserved.</div>
</div>

<!-- MAP IMAGE -->
<div class="map-wrap" id="mapWrap">
  <img
    id="mapImg"
    class="map-img"
    src="east-west-map.gif"
    alt="MSC East-West Service Network Map"
    draggable="false"
  />
</div>

<!-- LEGEND BAR -->
<div class="label-bar">
  <div class="lbl-item"><div class="lbl-dot" style="background:#009ADE;"></div>East-West Trade Lanes</div>
  <div class="lbl-item"><div class="lbl-dot" style="background:#f0a500;"></div>Key Transshipment Hubs</div>
  <div class="lbl-item"><div class="lbl-dot" style="background:#00a86b;"></div>Port of Call</div>
  <div class="lbl-item"><div class="lbl-dot" style="background:#e05050;"></div>Suez Canal Passage</div>
</div>

<!-- ZOOM BUTTONS -->
<div class="zoom-bar">
  <button class="zbtn" id="btnZoomIn" title="Zoom In">+</button>
  <button class="zbtn" id="btnZoomOut" title="Zoom Out">−</button>
  <button class="zbtn" id="btnZoomReset" title="Reset" style="font-size:14px;">⟳</button>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ── Pinch/Zoom & Pan ──
const wrap = document.getElementById('mapWrap');
const img  = document.getElementById('mapImg');

let scale = 1, originX = 0, originY = 0;
let isDragging = false, startX = 0, startY = 0, lastX = 0, lastY = 0;

function applyTransform() {
  img.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
  img.style.transformOrigin = '50% 50%';
}

// Mouse wheel zoom
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.min(Math.max(scale * delta, 0.5), 8);
  applyTransform();
}, { passive: false });

// Mouse drag pan
wrap.addEventListener('mousedown', e => {
  if (scale <= 1) return;
  isDragging = true;
  startX = e.clientX - lastX;
  startY = e.clientY - lastY;
  wrap.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  originX = e.clientX - startX;
  originY = e.clientY - startY;
  lastX = originX; lastY = originY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  wrap.style.cursor = '';
});

// Touch pinch-zoom
let lastDist = 0;
wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastDist = Math.hypot(dx, dy);
  } else if (e.touches.length === 1 && scale > 1) {
    isDragging = true;
    startX = e.touches[0].clientX - lastX;
    startY = e.touches[0].clientY - lastY;
  }
}, { passive: true });
wrap.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = dist / lastDist;
    scale = Math.min(Math.max(scale * delta, 0.5), 8);
    lastDist = dist;
    applyTransform();
  } else if (e.touches.length === 1 && isDragging) {
    e.preventDefault();
    originX = e.touches[0].clientX - startX;
    originY = e.touches[0].clientY - startY;
    lastX = originX; lastY = originY;
    applyTransform();
  }
}, { passive: false });
wrap.addEventListener('touchend', () => { isDragging = false; });

// Zoom buttons
document.getElementById('btnZoomIn').addEventListener('click', () => {
  scale = Math.min(scale * 1.3, 8); applyTransform();
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  scale = Math.max(scale * 0.77, 0.5); applyTransform();
});
document.getElementById('btnZoomReset').addEventListener('click', () => {
  scale = 1; originX = 0; originY = 0; lastX = 0; lastY = 0;
  applyTransform();
  showToast('Map reset');
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(showToast._tid);
  showToast._tid = setTimeout(() => { t.style.opacity = '0'; }, 2000);
}
</script>
</body>
</html>
