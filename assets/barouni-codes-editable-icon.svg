<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Barouni Codes pyramid icon">
  <defs>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A742F4"/>
      <stop offset="1" stop-color="#5D2DE1"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12B9F2"/>
      <stop offset="1" stop-color="#1868FF"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9B28"/>
      <stop offset="1" stop-color="#FF4C6A"/>
    </linearGradient>
  </defs>

  <g transform="translate(40 34)">
    <!-- Main pyramid silhouette -->
    <polygon points="120,12 230,228 10,228" fill="#1D2433" opacity="0.16"/>

    <!-- Three clean facets -->
    <polygon points="120,0 56,116 120,164" fill="url(#leftFace)"/>
    <polygon points="120,0 184,116 120,164" fill="url(#rightFace)"/>
    <polygon points="120,0 56,116 184,116" fill="url(#topFace)"/>

    <!-- Base facets for depth -->
    <polygon points="56,116 120,164 34,238" fill="url(#leftFace)"/>
    <polygon points="184,116 120,164 206,238" fill="url(#rightFace)"/>

    <!-- Central cut to make the mark more iconic -->
    <polygon points="120,46 94,96 120,116 146,96" fill="#F2F5FA" opacity="0.9"/>

    <!-- Bottom grounding -->
    <polygon points="34,238 120,164 206,238" fill="#0E1422" opacity="0.18"/>
  </g>
</svg>
