<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Barouni Codes pyramid icon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AC8FA"/>
      <stop offset="1" stop-color="#0077FF"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#FF3D6E"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B4DFF"/>
      <stop offset="1" stop-color="#5A1FD1"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1CD8D2"/>
      <stop offset="1" stop-color="#2EB872"/>
    </linearGradient>
  </defs>

  <g transform="translate(30 24)">
    <polygon points="130,10 250,250 10,250" fill="#202A3A" opacity="0.16"/>

    <polygon points="130,0 70,118 190,118" fill="url(#sunset)"/>
    <polygon points="70,118 130,0 130,180" fill="url(#violet)"/>
    <polygon points="130,0 190,118 130,180" fill="url(#sky)"/>

    <polygon points="70,118 130,180 38,250" fill="url(#teal)"/>
    <polygon points="130,180 190,118 222,250" fill="url(#sky)"/>
    <polygon points="70,118 190,118 130,180" fill="#F2F4F8" opacity="0.55"/>

    <polygon points="38,250 130,180 222,250" fill="#0D1422" opacity="0.2"/>
  </g>
</svg>
